<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Obsidian-Emerald Stadium Night Background -->
    <radialGradient id="stadiumBg" cx="55%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0b281c" />
      <stop offset="65%" stop-color="#04120c" />
      <stop offset="100%" stop-color="#020805" />
    </radialGradient>

    <!-- Brushed Silver-Chrome Bevel Ring -->
    <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Neon Turf Inner Ring -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ff00" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a8ff00" />
    </linearGradient>

    <!-- Titanium Rocket Thruster -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Blazing 92.9% Burn Rocket Flame -->
    <linearGradient id="outerFlame" x1="75%" y1="25%" x2="5%" y2="95%">
      <stop offset="0%" stop-color="#fff7aa" />
      <stop offset="30%" stop-color="#ffb800" />
      <stop offset="70%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="innerFlame" x1="80%" y1="20%" x2="20%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>

    <!-- 3D Soccer Ball Shading -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="58%" stop-color="#e2e8f0" />
      <stop offset="88%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <!-- Supersonic Neon-Lime Shockwave Glow -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="badgeClip">
      <circle cx="100" cy="100" r="84" />
    </clipPath>
  </defs>

  <!-- 1. OUTER CHROME & NEON-GREEN EMBLEM RING -->
  <circle cx="100" cy="100" r="89" fill="url(#chromeRim)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="100" cy="100" r="85" fill="#030b07" stroke="url(#neonRim)" stroke-width="2.4" />
  <circle cx="100" cy="100" r="82.5" fill="url(#stadiumBg)" />

  <!-- 2. STADIUM FLOODLIGHT BEAMS (Clipped inside badge) -->
  <g clip-path="url(#badgeClip)" opacity="0.22">
    <polygon points="125,10 155,15 65,185 25,165" fill="#4ade80" />
    <polygon points="165,40 185,70 95,190 65,185" fill="#a8ff00" />
  </g>

  <!-- 3. SUPERSONIC SPEED STREAKS -->
  <line x1="72" y1="90" x2="36" y2="126" stroke="#ff7b00" stroke-width="2.6" stroke-linecap="round" opacity="0.85" />
  <line x1="106" y1="126" x2="72" y2="160" stroke="#ff9900" stroke-width="2.6" stroke-linecap="round" opacity="0.85" />
  <line x1="62" y1="106" x2="28" y2="140" stroke="#ff4d00" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 4. BLAZING ROCKET THRUSTER FLAME (Breaking out of bottom-left ring) -->
  <path d="M 86 98 C 68 92, 48 112, 34 134 C 42 130, 48 130, 44 138 C 35 150, 24 162, 18 173 C 34 164, 48 154, 58 144 C 55 151, 51 157, 46 162 C 64 152, 82 138, 96 122 C 102 114, 96 102, 86 98 Z"
        fill="url(#outerFlame)" stroke="#7c2d12" stroke-width="1.2" stroke-linejoin="round" />

  <path d="M 88 102 C 74 99, 58 114, 42 138 C 52 133, 60 128, 56 137 C 46 149, 36 158, 30 164 C 48 152, 66 138, 78 126 C 84 121, 94 111, 88 102 Z"
        fill="url(#innerFlame)" />

  <path d="M 89 105 C 80 104, 68 114, 56 130 C 70 122, 82 115, 89 105 Z"
        fill="#ffffff" />

  <!-- 5. TITANIUM AERODYNAMIC ROCKET FINS & NOZZLE -->
  <!-- Top-Left Fin -->
  <path d="M 102 72 C 88 74, 76 80, 68 90 C 78 90, 88 92, 95 96 Z"
        fill="url(#titaniumGrad)" stroke="#09150f" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Bottom-Right Fin -->
  <path d="M 128 98 C 126 112, 120 124, 110 132 C 110 122, 108 112, 104 105 Z"
        fill="url(#titaniumGrad)" stroke="#09150f" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Rocket Engine Body & Nozzle Collar -->
  <path d="M 96 78 L 122 104 L 106 118 L 82 94 Z"
        fill="url(#titaniumGrad)" stroke="#09150f" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="92" cy="108" rx="7" ry="15" transform="rotate(-45 92 108)"
           fill="#334155" stroke="#09150f" stroke-width="2.2" />

  <!-- 6. SUPERSONIC NEON-LIME SHOCKWAVE RING (Back Arc) -->
  <path d="M 90 66 C 84 60, 96 56, 110 68"
        fill="none" stroke="#a8ff00" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- 7. HIGH-CONTRAST 3D CHAMPIONS SOCCER BALL -->
  <g transform="translate(131, 71)">
    <circle cx="0" cy="0" r="33" fill="url(#ballShade)" stroke="#07120c" stroke-width="2.6" />

    <!-- Subtle Neon Turf Rim Reflection on Ball Bottom -->
    <path d="M -22 23 A 31 31 0 0 0 24 20" fill="none" stroke="#a8ff00" stroke-width="1.8" opacity="0.75" />

    <!-- Center Pentagon -->
    <polygon points="0,-10 10,-2 6,10 -6,10 -10,-2" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <!-- Top-Left Pentagon -->
    <polygon points="-24,-14 -14,-22 -6,-15 -11,-5 -22,-5" fill="#0f172a" />
    <!-- Top-Right Pentagon -->
    <polygon points="10,-25 22,-18 20,-7 10,-9 6,-18" fill="#0f172a" />
    <!-- Bottom-Right Pentagon -->
    <polygon points="22,4 29,12 22,22 12,18 14,7" fill="#0f172a" />
    <!-- Bottom Pentagon -->
    <polygon points="-8,22 4,22 10,29 -2,32 -12,28" fill="#0f172a" />

    <!-- Seam Lines -->
    <line x1="0" y1="-10" x2="-6" y2="-15" stroke="#0f172a" stroke-width="2" />
    <line x1="0" y1="-10" x2="6" y2="-18" stroke="#0f172a" stroke-width="2" />
    <line x1="10" y1="-2" x2="20" y2="-7" stroke="#0f172a" stroke-width="2" />
    <line x1="10" y1="-2" x2="14" y2="7" stroke="#0f172a" stroke-width="2" />
    <line x1="6" y1="10" x2="12" y2="18" stroke="#0f172a" stroke-width="2" />
    <line x1="6" y1="10" x2="4" y2="22" stroke="#0f172a" stroke-width="2" />
    <line x1="-6" y1="10" x2="-8" y2="22" stroke="#0f172a" stroke-width="2" />
    <line x1="-10" y1="-2" x2="-22" y2="-5" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- 8. SUPERSONIC NEON-LIME SHOCKWAVE RING (Front Arc Overlapping Booster) -->
  <path d="M 90 66 C 85 75, 98 96, 114 111 C 126 122, 137 123, 134 112"
        fill="none" stroke="#a8ff00" stroke-width="4.2" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 90 66 C 85 75, 98 96, 114 111 C 126 122, 137 123, 134 112"
        fill="none" stroke="#ecfccb" stroke-width="1.6" stroke-linecap="round" />
</svg>
