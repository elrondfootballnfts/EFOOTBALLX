<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    background: #06030c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
  }
  svg { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Vignette & Violet Stadium Lights -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#240c3d" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#120520" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040108" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="violetCore" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Carbon Fiber Weave -->
    <pattern id="carbonWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#0f0719"/>
      <path d="M0 0 L8 8 L16 0 L8 -8 Z M0 16 L8 24 L16 16 L8 8 Z" fill="#180b29" opacity="0.6"/>
      <rect x="0" y="0" width="8" height="8" fill="#24103d" opacity="0.3"/>
      <rect x="8" y="8" width="8" height="8" fill="#24103d" opacity="0.3"/>
    </pattern>

    <!-- Radial Chronometer Dial Pattern -->
    <pattern id="chronoGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="28" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.25"/>
      <line x1="30" y1="2" x2="30" y2="58" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="2" y1="30" x2="58" y2="30" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.2"/>
    </pattern>

    <!-- Metallic Violet Gradients -->
    <linearGradient id="violetBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="20%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="55%" stop-color="#581c87"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="90%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="bannerMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="neonVioletGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <circle cx="140" cy="120" r="320" fill="#a855f7" opacity="0.08"/>
  <circle cx="884" cy="120" r="320" fill="#38bdf8" opacity="0.08"/>
  <circle cx="512" cy="480" r="420" fill="url(#violetCore)"/>

  <!-- 2. SHIELD EMBLEM -->
  <g filter="url(#heavyShadow)">
    <!-- Outer Violet Bevel -->
    <path d="M 512 85 
             C 690 85, 840 120, 850 170
             C 850 380, 820 620, 512 890
             C 204 620, 174 380, 174 170
             C 184 120, 334 85, 512 85 Z" 
          fill="url(#violetBevel)"/>

    <!-- Ultraviolet Neon Rim -->
    <path d="M 512 95 
             C 680 95, 828 128, 838 175
             C 838 375, 808 610, 512 875
             C 216 610, 186 375, 186 175
             C 196 128, 344 95, 512 95 Z" 
          fill="none" stroke="#a855f7" stroke-width="4" filter="url(#neonVioletGlow)" opacity="0.9"/>

    <!-- Middle Inset -->
    <path d="M 512 105 
             C 670 105, 816 136, 826 180
             C 826 370, 796 600, 512 860
             C 228 600, 198 370, 198 180
             C 208 136, 354 105, 512 105 Z" 
          fill="#0c0516" stroke="#581c87" stroke-width="3"/>

    <!-- Inner Shield Carbon Weave -->
    <path d="M 512 120 
             C 656 120, 800 150, 808 190
             C 808 365, 780 585, 512 840
             C 244 585, 216 365, 216 190
             C 224 150, 368 120, 512 120 Z" 
          fill="url(#carbonWeave)"/>

    <!-- Chrono Pattern Layer -->
    <path d="M 512 120 
             C 656 120, 800 150, 808 190
             C 808 365, 780 585, 512 840
             C 244 585, 216 365, 216 190
             C 224 150, 368 120, 512 120 Z" 
          fill="url(#chronoGrid)" opacity="0.6"/>
  </g>

  <!-- 3. CENTERPIECE: MATRIX CHRONO WARP STOPWATCH & SLOW-MOTION FOOTBALL -->
  <g transform="translate(512, 440)">
    <!-- Chronometer Dial Rings -->
    <circle cx="0" cy="-20" r="210" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6 8" opacity="0.7"/>
    <circle cx="0" cy="-20" r="185" fill="#17072b" fill-opacity="0.4" stroke="url(#violetBevel)" stroke-width="6" filter="url(#heavyShadow)"/>
    <circle cx="0" cy="-20" r="160" fill="none" stroke="#c084fc" stroke-width="2" filter="url(#neonVioletGlow)"/>

    <!-- Chrono Hour / Second Marks -->
    <!-- 12 Ticks -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.8">
      <line x1="0" y1="-175" x2="0" y2="-160"/>
      <line x1="0" y1="135" x2="0" y2="120"/>
      <line x1="-155" y1="-20" x2="-140" y2="-20"/>
      <line x1="155" y1="-20" x2="140" y2="-20"/>
      <line x1="-110" y1="-130" x2="-98" y2="-118"/>
      <line x1="110" y1="-130" x2="98" y2="-118"/>
      <line x1="-110" y1="90" x2="-98" y2="78"/>
      <line x1="110" y1="90" x2="98" y2="78"/>
    </g>

    <!-- Top Chrono Pushers & Crown -->
    <rect x="-18" y="-225" width="36" height="42" rx="6" fill="url(#violetBevel)" stroke="#581c87" stroke-width="3"/>
    <rect x="-65" y="-210" width="28" height="28" rx="6" fill="url(#violetBevel)" transform="rotate(-30 -51 -196)"/>
    <rect x="37" y="-210" width="28" height="28" rx="6" fill="url(#violetBevel)" transform="rotate(30 51 -196)"/>

    <!-- Matrix Slow-Motion Time Wave Shockwaves (Concentric Dilation Rings) -->
    <ellipse cx="0" cy="-20" rx="130" ry="130" fill="none" stroke="#a855f7" stroke-width="5" filter="url(#neonVioletGlow)"/>
    <ellipse cx="0" cy="-20" rx="95" ry="95" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>

    <!-- Chrono Second Hand Pointing to Matrix Freeze -->
    <line x1="0" y1="-20" x2="70" y2="-110" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#neonVioletGlow)"/>
    <circle cx="0" cy="-20" r="10" fill="#f43f5e"/>

    <!-- Slow-Motion Frozen Football in Center with Distortion Ripple -->
    <!-- Ghosted Motion Blur Trails -->
    <g opacity="0.3" transform="translate(-50, 20) scale(0.85)">
      <circle cx="0" cy="-20" r="42" fill="#c084fc"/>
    </g>
    <g opacity="0.5" transform="translate(-25, 10) scale(0.92)">
      <circle cx="0" cy="-20" r="42" fill="#a855f7"/>
    </g>
    <!-- Crisp Foreground Suspended Football -->
    <g filter="url(#heavyShadow)">
      <circle cx="0" cy="-20" r="46" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <polygon points="0,-36 16,-24 10,-8 -10,-8 -16,-24" fill="#120520"/>
      <polygon points="0,-4 16,-16 26,-8 22,12 8,16" fill="#120520" opacity="0.7"/>
      <!-- Glowing Matrix Cyan/Violet aura around the ball -->
      <circle cx="0" cy="-20" r="50" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#neonVioletGlow)"/>
    </g>

    <!-- Digital Matrix HUD Time Display: 00:00:01 -->
    <rect x="-85" y="45" width="170" height="36" rx="8" fill="#040108" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="22" font-weight="900" letter-spacing="4">00:00:01</text>
  </g>

  <!-- 4. BOTTOM 3D BANNER RIBBON -->
  <g filter="url(#heavyShadow)">
    <!-- Shadow folds -->
    <path d="M 190 770 L 260 735 L 260 815 L 190 850 Z" fill="#0c0414"/>
    <path d="M 834 770 L 764 735 L 764 815 L 834 850 Z" fill="#0c0414"/>

    <!-- Main Ribbon -->
    <path d="M 230 740 
             Q 512 705 794 740 
             L 814 825 
             Q 512 795 210 825 Z" 
          fill="url(#bannerMetal)" stroke="url(#violetBevel)" stroke-width="4"/>

    <!-- Violet Neon Line Inset -->
    <path d="M 240 750 
             Q 512 717 784 750 
             L 800 815 
             Q 512 785 224 815 Z" 
          fill="none" stroke="#a855f7" stroke-width="2" opacity="0.9"/>

    <circle cx="236" cy="782" r="6" fill="url(#violetBevel)"/>
    <circle cx="788" cy="782" r="6" fill="url(#violetBevel)"/>

    <!-- Typography: MATRIX WARP • -50% SPEED -->
    <text x="512" y="787" 
          text-anchor="middle" 
          fill="#000000" 
          font-family="'Impact', 'Bebas Neue', Arial Black, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="3.5">
      MATRIX WARP • -50% SPEED
    </text>
    <text x="512" y="784" 
          text-anchor="middle" 
          fill="#f5d0fe" 
          stroke="#1e0b36" 
          stroke-width="1.5"
          font-family="'Impact', 'Bebas Neue', Arial Black, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="3.5">
      MATRIX WARP • <tspan fill="#a855f7">-50% SPEED</tspan>
    </text>
  </g>
</svg>
</body>
</html>
