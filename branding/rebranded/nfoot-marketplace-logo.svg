<svg viewBox="0 0 920 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nfGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d4" />
      <stop offset="25%" stop-color="#ffb800" />
      <stop offset="50%" stop-color="#d48800" />
      <stop offset="75%" stop-color="#ffe285" />
      <stop offset="100%" stop-color="#8a5000" />
    </linearGradient>

    <linearGradient id="nfNeonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a8ff00" />
      <stop offset="70%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00994d" />
    </linearGradient>

    <radialGradient id="nfCarbonBase" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182e22" />
      <stop offset="55%" stop-color="#0b1710" />
      <stop offset="100%" stop-color="#030704" />
    </radialGradient>

    <radialGradient id="nfBallGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffd700" />
      <stop offset="85%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#662200" />
    </radialGradient>

    <filter id="nfDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00ff88" flood-opacity="0.45" />
    </filter>

    <pattern id="nfHexGrid" width="36" height="62.35" patternUnits="userSpaceOnUse">
      <path d="M18 0 L36 10.39 L36 31.18 L18 41.57 L0 31.18 L0 10.39 Z M18 62.35 L36 51.96 L36 31.18 L18 41.57 L0 31.18 L0 51.96 Z" fill="none" stroke="rgba(0, 255, 136, 0.08)" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="460" cy="460" r="410" fill="url(#nfCarbonBase)" />

  <!-- Outer Heavy Shield Crest -->
  <path d="M460 70 L790 180 C790 480 670 740 460 850 C250 740 130 480 130 180 Z" fill="url(#nfCarbonBase)" stroke="url(#nfGoldRim)" stroke-width="15" filter="url(#nfDropGlow)" />

  <!-- Inner Hex Weave -->
  <path d="M460 95 L765 195 C765 465 655 710 460 815 C265 710 155 465 155 195 Z" fill="url(#nfHexGrid)" stroke="url(#nfNeonGreen)" stroke-width="4.5" stroke-opacity="0.8" />

  <!-- Stadium Beam Flares -->
  <path d="M175 210 Q 460 360 745 210" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2.5" fill="none" />
  <path d="M225 270 Q 460 410 695 270" stroke="rgba(0, 255, 136, 0.22)" stroke-width="2" fill="none" />
  <path d="M280 330 Q 460 460 640 330" stroke="rgba(255, 184, 0, 0.28)" stroke-width="2" fill="none" />

  <!-- Top Crown Finial -->
  <g transform="translate(460, 115) scale(0.95)">
    <polygon points="0,-38 24,-10 52,-28 38,16 -38,16 -52,-28 -24,-10" fill="url(#nfGoldRim)" stroke="#ffffff" stroke-width="1.8" />
    <circle cx="0" cy="-38" r="5.5" fill="#00ff88" />
    <circle cx="52" cy="-28" r="4.5" fill="#00ff88" />
    <circle cx="-52" cy="-28" r="4.5" fill="#00ff88" />
  </g>

  <!-- Golden Laurel Wings -->
  <g stroke="url(#nfGoldRim)" stroke-width="3" fill="none" opacity="0.65">
    <path d="M195 320 C185 430 215 550 268 635" />
    <path d="M180 350 C170 450 195 540 248 615" />
    <path d="M725 320 C735 430 705 550 652 635" />
    <path d="M740 350 C750 450 725 540 672 615" />
  </g>

  <!-- Top Hint -->
  <text x="460" y="320" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" letter-spacing="5" font-weight="800" fill="#a8ff00">✦ THE FOOTBALL WEB3 HUB ✦</text>

  <!-- Typography NFooT (Large N, F, T - Small compact oo) -->
  <g transform="translate(460, 440)" text-anchor="middle">
    <!-- N -->
    <text x="-185" y="45" font-family="'Orbitron', sans-serif" font-weight="900" font-size="145" fill="url(#nfNeonGreen)" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.9))">N</text>
    <!-- F -->
    <text x="-75" y="45" font-family="'Orbitron', sans-serif" font-weight="900" font-size="145" fill="url(#nfNeonGreen)" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.9))">F</text>

    <!-- Small compact oo footballs (reads NFT at a glance, or Foot!) -->
    <!-- Mini Football 'o' 1 -->
    <g transform="translate(5, 5)">
      <circle cx="0" cy="0" r="23" fill="url(#nfBallGold)" stroke="#ffffff" stroke-width="2.4" filter="drop-shadow(0 0 12px rgba(255,184,0,0.95))" />
      <!-- Soccer ball pentagon and seams -->
      <polygon points="0,-7.5 7.1,-2.3 4.4,6.5 -4.4,6.5 -7.1,-2.3" fill="#2d1500" stroke="#ffe285" stroke-width="1.4" />
      <line x1="0" y1="-7.5" x2="0" y2="-22" stroke="#ffe285" stroke-width="1.4" />
      <line x1="7.1" y1="-2.3" x2="21" y2="-7" stroke="#ffe285" stroke-width="1.4" />
      <line x1="4.4" y1="6.5" x2="14" y2="19" stroke="#ffe285" stroke-width="1.4" />
      <line x1="-4.4" y1="6.5" x2="-14" y2="19" stroke="#ffe285" stroke-width="1.4" />
      <line x1="-7.1" y1="-2.3" x2="-21" y2="-7" stroke="#ffe285" stroke-width="1.4" />
      <!-- Specular arc highlight -->
      <path d="M-14 -12 A 18 18 0 0 1 12 -14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
    </g>

    <!-- Mini Football 'o' 2 -->
    <g transform="translate(49, 5)">
      <circle cx="0" cy="0" r="23" fill="url(#nfBallGold)" stroke="#ffffff" stroke-width="2.4" filter="drop-shadow(0 0 12px rgba(255,184,0,0.95))" />
      <!-- Soccer ball pentagon and seams -->
      <polygon points="0,-7.5 7.1,-2.3 4.4,6.5 -4.4,6.5 -7.1,-2.3" fill="#2d1500" stroke="#ffe285" stroke-width="1.4" />
      <line x1="0" y1="-7.5" x2="0" y2="-22" stroke="#ffe285" stroke-width="1.4" />
      <line x1="7.1" y1="-2.3" x2="21" y2="-7" stroke="#ffe285" stroke-width="1.4" />
      <line x1="4.4" y1="6.5" x2="14" y2="19" stroke="#ffe285" stroke-width="1.4" />
      <line x1="-4.4" y1="6.5" x2="-14" y2="19" stroke="#ffe285" stroke-width="1.4" />
      <line x1="-7.1" y1="-2.3" x2="-21" y2="-7" stroke="#ffe285" stroke-width="1.4" />
      <!-- Specular arc highlight -->
      <path d="M-14 -12 A 18 18 0 0 1 12 -14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
    </g>

    <!-- T -->
    <text x="135" y="45" font-family="'Orbitron', sans-serif" font-weight="900" font-size="145" fill="url(#nfNeonGreen)" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.9))">T</text>
  </g>

  <!-- Ribbon Banner for MARKETPLACE -->
  <g transform="translate(460, 580)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#0a1710" stroke="url(#nfGoldRim)" stroke-width="3" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.85))" />
    <text x="0" y="11" text-anchor="middle" font-family="'Bebas Neue', sans-serif" font-size="44" letter-spacing="9" fill="#ffb800" font-weight="700">★ MARKETPLACE ★</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="460" y="680" text-anchor="middle" font-family="'Orbitron', monospace" font-size="16" letter-spacing="7" font-weight="800" fill="#8daaa0">SUNDAY LEAGUE DEGEN FC • MULTIVERSX</text>

  <!-- Nexus Cross at Bottom Peak -->
  <g transform="translate(460, 792) scale(0.85)">
    <polygon points="0,-20 13,-7 20,0 13,7 0,20 -13,7 -20,0 -13,-7" fill="url(#nfGoldRim)" />
  </g>
</svg>
