name: Build MultiversX WASM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Smart Contract WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: |
          cd contracts/efoo-stadium-vault/meta
          cargo run -- build

      - name: Verify Artifacts
        run: |
          ls -la contracts/efoo-stadium-vault/output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efoo-stadium-vault-wasm
          path: contracts/efoo-stadium-vault/output/*

      - name: Publish WASM to site
        run: |
          mkdir -p contracts-dist
          cp contracts/efoo-stadium-vault/output/* contracts-dist/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f contracts/efoo-stadium-vault/output/* contracts-dist/* || true
          git commit -m "build(wasm): automated contract build [skip ci]" || echo "No changes"
          git push origin HEAD:main || echo "Push skipped"
