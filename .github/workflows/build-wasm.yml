name: Build MultiversX WASM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Smart Contract WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.78.0
          targets: wasm32-unknown-unknown

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build and Optimize WASM
        run: |
          cd contracts/efoo-stadium-vault
          RUSTFLAGS="-C link-arg=--allow-undefined" cargo build --package efoo-stadium-vault-wasm --target wasm32-unknown-unknown --release
          mkdir -p output
          wasm-opt -Oz target/wasm32-unknown-unknown/release/efoo_stadium_vault_wasm.wasm -o output/efoo-stadium-vault.wasm --strip-debug --strip-producers
          ls -lh output/

      - name: Verify and Publish WASM to site
        run: |
          mkdir -p contracts-dist
          cp contracts/efoo-stadium-vault/output/* contracts-dist/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f contracts/efoo-stadium-vault/output/* contracts-dist/* || true
          git commit -m "build(wasm): automated contract build [skip ci]" || echo "No changes"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || echo "Push skipped"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efoo-stadium-vault-wasm
          path: contracts/efoo-stadium-vault/output/*
