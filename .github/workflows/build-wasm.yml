name: Build MultiversX WASM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Smart Contract WASM
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          cd contracts/efoo-stadium-vault/meta
          cargo run -- build 2>&1 | tee ../../../build.log
          cd ../../..
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "*.wasm" -o -name "*.abi.json"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efoo-stadium-vault-build
          path: |
            build.log
            **/*.wasm
            **/*.abi.json

      - name: Commit and Push WASM to repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build.log contracts/efoo-stadium-vault/output/ || true
          git commit -m "chore(build): automated WASM bytecode build and log [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Could not push"
