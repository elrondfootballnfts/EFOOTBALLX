name: Build MultiversX WASM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build via Official MultiversX Contract Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Smart Contract with Official Docker Builder
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace multiversx/sdk-rust-contract-builder:v8.0.1 \
            --project=/workspace/contracts/efoo-stadium-vault

      - name: Verify Artifacts
        run: |
          ls -la ${{ github.workspace }}/contracts/efoo-stadium-vault/output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efoo-stadium-vault-wasm
          path: contracts/efoo-stadium-vault/output/*

      - name: Commit and Push WASM to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f contracts/efoo-stadium-vault/output/*
          git commit -m "build(wasm): official reproducible contract build [skip ci]" || echo "No changes"
          git push origin HEAD:main || echo "Push fallback"
